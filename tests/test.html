<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Exoplanet Universe — Automated Test Runner</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
  background: #0a0e17;

/* Header */

/* Results */
#results {

.category {

.category-header {

/* Progress bar */

<body>

<div id="header">
  <h1>Exoplanet Universe <span>Test Runner</span></h1>
  <div id="summary">
    <span class="summary-badge pending" id="sum-pass">0 passed</span>
    <span class="summary-badge pending" id="sum-fail">0 failed</span>
    <span class="summary-badge pending" id="sum-skip">0 skipped</span>
    <span id="status-text">Waiting for app to load...</span>
  </div>
</div>

<div id="controls">
  <button id="btn-run" disabled>Run All Tests</button>
  <button id="btn-rerun-failed" disabled>Re-run Failed</button>
  <div id="filter-bar">
    <button class="filter-btn active" data-filter="all">All</button>
    <button class="filter-btn" data-filter="pass">Passed</button>
    <button class="filter-btn" data-filter="fail">Failed</button>
    <button class="filter-btn" data-filter="skip">Skipped</button>
  </div>
</div>

<div id="progress-bar"><div id="progress-fill"></div></div>
<div id="timing"></div>
<div id="results"></div>

<!-- Hidden iframe for the app under test -->
<iframe id="app-frame" src="../app.html" style="position:absolute;width:1px;height:1px;opacity:0;pointer-events:none;left:-9999px;top:-9999px;"></iframe>

<script>
// ============================================================================
// MINIMAL TEST FRAMEWORK — zero dependencies
// ============================================================================

const TestRunner = {
  tests: [],
  results: [],
  categories: {},
  startTime: 0,

  // Register a test
  test(category, id, name, fn) {
    if (!this.categories[category]) this.categories[category] = [];
    const entry = { category, id, name, fn, status: 'pending', error: null, duration: 0 };
    this.tests.push(entry);
    this.categories[category].push(entry);
  },

  // Run all tests (or a subset)
  async run(filter) {
    const toRun = filter ? this.tests.filter(filter) : this.tests;
    this.startTime = performance.now();

    // Reset all targeted tests
    for (const t of toRun) {
      t.status = 'pending';
      t.error = null;
      t.duration = 0;
    }

    updateUI();
    let completed = 0;

    for (const t of toRun) {
      const t0 = performance.now();
      try {
        await t.fn();
        t.status = 'pass';
      } catch (e) {
        if (e && e.__skip) {
          t.status = 'skip';
          t.error = e.message;
        } else {
          t.status = 'fail';
          t.error = e;
        }
      }
      t.duration = performance.now() - t0;
      completed++;
      updateProgress(completed, toRun.length);
      updateUI();
    }

    const elapsed = performance.now() - this.startTime;
    document.getElementById('timing').textContent =
      `Completed in ${elapsed.toFixed(0)}ms (${toRun.length} tests)`;
  },

  // Get counts
  counts() {
    let pass = 0, fail = 0, skip = 0, pending = 0;
    for (const t of this.tests) {
      if (t.status === 'pass') pass++;
      else if (t.status === 'fail') fail++;
      else if (t.status === 'skip') skip++;
      else pending++;
    }
    return { pass, fail, skip, pending, total: this.tests.length };
  }
};

// ============================================================================
// ASSERTIONS
// ============================================================================

function assert(condition, msg) {
  if (!condition) throw new AssertionError(msg || 'Assertion failed');
}

function assertEqual(actual, expected, msg) {
  if (actual !== expected) {
    throw new AssertionError(
      (msg ? msg + ': ' : '') +
      `expected <code class="expected">${JSON.stringify(expected)}</code>, ` +
      `got <code class="actual">${JSON.stringify(actual)}</code>`
    );
  }
}

function assertNotEqual(actual, unexpected, msg) {
  if (actual === unexpected) {
    throw new AssertionError(
      (msg ? msg + ': ' : '') +
      `expected value to NOT be <code class="actual">${JSON.stringify(unexpected)}</code>`
    );
  }
}

function assertTrue(val, msg) {
  if (val !== true) {
    throw new AssertionError(
      (msg ? msg + ': ' : '') +
      `expected <code class="expected">true</code>, got <code class="actual">${JSON.stringify(val)}</code>`
    );
  }
}

function assertFalse(val, msg) {
  if (val !== false) {
    throw new AssertionError(
      (msg ? msg + ': ' : '') +
      `expected <code class="expected">false</code>, got <code class="actual">${JSON.stringify(val)}</code>`
    );
  }
}

function assertGreaterThan(val, threshold, msg) {
  if (!(val > threshold)) {
    throw new AssertionError(
      (msg ? msg + ': ' : '') +
      `expected value > <code class="expected">${threshold}</code>, got <code class="actual">${val}</code>`
    );
  }
}

function assertLessThan(val, threshold, msg) {
  if (!(val < threshold)) {
    throw new AssertionError(
      (msg ? msg + ': ' : '') +
      `expected value < <code class="expected">${threshold}</code>, got <code class="actual">${val}</code>`
    );
  }
}

function assertInstanceOf(val, constructor, msg) {
  if (!(val instanceof constructor)) {
    throw new AssertionError(
      (msg ? msg + ': ' : '') +
      `expected instance of <code class="expected">${constructor.name}</code>, ` +
      `got <code class="actual">${val && val.constructor ? val.constructor.name : typeof val}</code>`
    );
  }
}

function assertExists(val, msg) {
  if (val == null) {
    throw new AssertionError(
      (msg ? msg + ': ' : '') +
      `expected value to exist, got <code class="actual">${JSON.stringify(val)}</code>`
    );
  }
}

function assertType(val, type, msg) {
  if (typeof val !== type) {
    throw new AssertionError(
      (msg ? msg + ': ' : '') +
      `expected type <code class="expected">${type}</code>, got <code class="actual">${typeof val}</code>`
    );
  }
}

function skip(reason) {
  const e = new Error(reason || 'Skipped');
  e.__skip = true;
  throw e;
}

class AssertionError extends Error {
  constructor(msg) {
    super(msg);
    this.name = 'AssertionError';
  }
}

// ============================================================================
// UI RENDERING
// ============================================================================

function updateProgress(done, total) {
  const pct = total > 0 ? (done / total * 100) : 0;
  document.getElementById('progress-fill').style.width = pct + '%';
}

function updateUI() {
  const c = TestRunner.counts();

  const sumPass = document.getElementById('sum-pass');
  const sumFail = document.getElementById('sum-fail');
  const sumSkip = document.getElementById('sum-skip');

  sumPass.textContent = c.pass + ' passed';
  sumPass.className = 'summary-badge ' + (c.pass > 0 ? 'pass' : 'pending');

  sumFail.textContent = c.fail + ' failed';
  sumFail.className = 'summary-badge ' + (c.fail > 0 ? 'fail' : 'pending');

  sumSkip.textContent = c.skip + ' skipped';
  sumSkip.className = 'summary-badge ' + (c.skip > 0 ? 'skip' : 'pending');

  const statusEl = document.getElementById('status-text');
  if (c.pending === c.total) {
    statusEl.textContent = 'Ready to run';
  } else if (c.pending > 0) {
    statusEl.textContent = `Running... (${c.total - c.pending}/${c.total})`;
  } else if (c.fail === 0) {
    statusEl.textContent = 'All tests passed';
    statusEl.style.color = '#5cd880';
  } else {
    statusEl.textContent = `${c.fail} test${c.fail > 1 ? 's' : ''} failed`;
    statusEl.style.color = '#f06060';
  }

  renderResults();
}

function renderResults() {
  const container = document.getElementById('results');
  const activeFilter = document.querySelector('.filter-btn.active')?.dataset.filter || 'all';

  let html = '';
  const categoryOrder = Object.keys(TestRunner.categories);

  for (const cat of categoryOrder) {
    const tests = TestRunner.categories[cat];
    const filtered = activeFilter === 'all' ? tests : tests.filter(t => t.status === activeFilter);
    if (filtered.length === 0 && activeFilter !== 'all') continue;

    const catCounts = { pass: 0, fail: 0, skip: 0, pending: 0 };
    for (const t of tests) catCounts[t.status]++;
    const countStr = [];
    if (catCounts.pass) countStr.push(catCounts.pass + ' passed');
    if (catCounts.fail) countStr.push(catCounts.fail + ' failed');
    if (catCounts.skip) countStr.push(catCounts.skip + ' skipped');
    if (catCounts.pending) countStr.push(catCounts.pending + ' pending');

    html += `<div class="category">`;
    html += `<div class="category-header">${escHtml(cat)} <span class="category-count">${countStr.join(' / ')}</span></div>`;

    const displayTests = activeFilter === 'all' ? tests : filtered;
    for (const t of displayTests) {
      const icon = t.status === 'pass' ? '&#10003;' :
                   t.status === 'fail' ? '&#10007;' :
                   t.status === 'skip' ? '&#8212;' : '&#8226;';

      html += `<div class="test-row">`;
      html += `<div class="test-icon ${t.status}">${icon}</div>`;
      html += `<div class="test-name"><span class="test-id">${escHtml(t.id)}</span>${escHtml(t.name)}</div>`;
      html += `<div class="test-duration">${t.duration > 0 ? t.duration.toFixed(1) + 'ms' : ''}</div>`;
      html += `</div>`;

      if (t.status === 'fail' && t.error) {
        const errMsg = t.error instanceof AssertionError
          ? t.error.message
          : escHtml(t.error.message || String(t.error));
        html += `<div class="test-detail">${errMsg}</div>`;
      }
      if (t.status === 'skip' && t.error) {
        html += `<div class="test-detail" style="color:#a09050;background:rgba(200,180,60,.03);border-left-color:rgba(200,180,60,.2)">${escHtml(t.error)}</div>`;
      }
    }

    html += `</div>`;
  }

  container.innerHTML = html;
}

function escHtml(s) {
  const d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}

// ============================================================================
// APP ACCESS LAYER
//
// CRITICAL: The app uses `let`/`const` at the top level of an inline <script>,
// which means those variables are NOT properties of `window`. Only `function`
// declarations are hoisted to the window object.
//
// To access `let`/`const` variables (NASA_DATA, scene, namedPlanets, CAM,
// filters, BN, PLANET_TEX, NASA_BY_NAME, searchIndex, renderer, raycaster,
// FEATURED_NAMES), we use eval() in the iframe's context.
//
// Functions (planetClass, toXYZ, nasaToUserData, etc.) are accessible via
// W.functionName directly.
// ============================================================================

let W = null;   // iframe window reference (for function calls + document)

// Evaluate an expression in the app's scope to access let/const variables
function $(expr) {
  return W.eval(expr);
}

// ============================================================================
// APP LOADING — wait for iframe + NASA data
// ============================================================================

function waitForApp() {
  return new Promise((resolve, reject) => {
    const iframe = document.getElementById('app-frame');
    const TIMEOUT = 15000;
    const POLL = 200;
    const start = Date.now();

    function check() {
      try {
        const iw = iframe.contentWindow;
        if (!iw) {
          if (Date.now() - start > TIMEOUT) return reject(new Error('Iframe did not load'));
          return setTimeout(check, POLL);
        }

        // Check Three.js loaded (THREE is on window via the CDN script)
        if (!iw.THREE) {
          if (Date.now() - start > TIMEOUT) return reject(new Error('Three.js did not load'));
          return setTimeout(check, POLL);
        }

        // Check NASA_DATA populated (let-scoped, must use eval)
        let nasaLen = 0;
        try { nasaLen = iw.eval('NASA_DATA.length'); } catch (e) { /* not ready */ }
        if (!nasaLen || nasaLen === 0) {
          if (Date.now() - start > TIMEOUT) return reject(new Error('NASA data did not load within timeout'));
          return setTimeout(check, POLL);
        }

        // Check scene exists
        let hasScene = false;
        try { hasScene = iw.eval('typeof scene !== "undefined" && scene !== null'); } catch (e) {}
        if (!hasScene) {
          if (Date.now() - start > TIMEOUT) return reject(new Error('Scene not initialized'));
          return setTimeout(check, POLL);
        }

        // Check namedPlanets populated
        let npLen = 0;
        try { npLen = iw.eval('namedPlanets.length'); } catch (e) {}
        if (!npLen || npLen === 0) {
          if (Date.now() - start > TIMEOUT) return reject(new Error('Named planets not populated'));
          return setTimeout(check, POLL);
        }

        // Check searchIndex populated
        let siLen = 0;
        try { siLen = iw.eval('searchIndex.length'); } catch (e) {}
        if (!siLen || siLen === 0) {
          if (Date.now() - start > TIMEOUT) return reject(new Error('Search index not built'));
          return setTimeout(check, POLL);
        }

        W = iw;
        resolve();
      } catch (e) {
        if (Date.now() - start > TIMEOUT) return reject(new Error('Cannot access iframe: ' + e.message));
        setTimeout(check, POLL);
      }
    }

    iframe.addEventListener('load', () => setTimeout(check, 300));
    setTimeout(check, 500);
  });
}

// ============================================================================
// TEST DEFINITIONS
// ============================================================================

function defineTests() {

  // ─── A. PURE FUNCTION TESTS ───────────────────────────────────────────────
  //
  // Functions declared with `function` keyword are on the window object,
  // so W.functionName() works directly.

  // A1: planetClass
  TestRunner.test('A. Pure Functions', 'A1a', 'planetClass(0.5) = rocky', () => {
    assertEqual(W.planetClass(0.5), 'rocky');
  });
  TestRunner.test('A. Pure Functions', 'A1b', 'planetClass(1.59) = rocky (boundary)', () => {
    assertEqual(W.planetClass(1.59), 'rocky');
  });
  TestRunner.test('A. Pure Functions', 'A1c', 'planetClass(1.6) = super (boundary)', () => {
    assertEqual(W.planetClass(1.6), 'super');
  });
  TestRunner.test('A. Pure Functions', 'A1d', 'planetClass(1.61) = super', () => {
    assertEqual(W.planetClass(1.61), 'super');
  });
  TestRunner.test('A. Pure Functions', 'A1e', 'planetClass(2.99) = super', () => {
    assertEqual(W.planetClass(2.99), 'super');
  });
  TestRunner.test('A. Pure Functions', 'A1f', 'planetClass(3.0) = neptune (boundary)', () => {
    assertEqual(W.planetClass(3.0), 'neptune');
  });
  TestRunner.test('A. Pure Functions', 'A1g', 'planetClass(3.01) = neptune', () => {
    assertEqual(W.planetClass(3.01), 'neptune');
  });
  TestRunner.test('A. Pure Functions', 'A1h', 'planetClass(7.99) = neptune', () => {
    assertEqual(W.planetClass(7.99), 'neptune');
  });
  TestRunner.test('A. Pure Functions', 'A1i', 'planetClass(8.0) = gas (boundary)', () => {
    assertEqual(W.planetClass(8.0), 'gas');
  });
  TestRunner.test('A. Pure Functions', 'A1j', 'planetClass(8.01) = gas', () => {
    assertEqual(W.planetClass(8.01), 'gas');
  });

  // A2: toXYZ
  TestRunner.test('A. Pure Functions', 'A2a', 'toXYZ returns THREE.Vector3', () => {
    const v = W.toXYZ(0, 0, 100);
    assertInstanceOf(v, W.THREE.Vector3, 'toXYZ should return Vector3');
  });
  TestRunner.test('A. Pure Functions', 'A2b', 'toXYZ(0,0,0) near origin', () => {
    const v = W.toXYZ(0, 0, 0);
    const mag = v.length();
    assertLessThan(mag, 1, 'dist=0 should map near origin');
  });
  TestRunner.test('A. Pure Functions', 'A2c', 'toXYZ(0,0,100) positive X', () => {
    const v = W.toXYZ(0, 0, 100);
    assertGreaterThan(v.x, 0, 'RA=0,Dec=0 should have positive X');
    assertLessThan(Math.abs(v.y), 0.01, 'Dec=0 should have near-zero Y');
  });
  TestRunner.test('A. Pure Functions', 'A2d', 'toXYZ log-scaling: dist=10 vs dist=100 not 10x apart', () => {
    const v10 = W.toXYZ(0, 0, 10);
    const v100 = W.toXYZ(0, 0, 100);
    const ratio = v100.length() / v10.length();
    assertLessThan(ratio, 5, 'Log scaling should compress distances (ratio should be < 5)');
    assertGreaterThan(ratio, 1, 'Farther should still be farther');
  });
  TestRunner.test('A. Pure Functions', 'A2e', 'toXYZ(90,0,100) positive Z', () => {
    const v = W.toXYZ(90, 0, 100);
    assertGreaterThan(v.z, 0, 'RA=90 should have positive Z component');
  });
  TestRunner.test('A. Pure Functions', 'A2f', 'toXYZ(0,90,100) positive Y (north pole)', () => {
    const v = W.toXYZ(0, 90, 100);
    assertGreaterThan(v.y, 0, 'Dec=90 should have positive Y');
    assertLessThan(Math.abs(v.x), 1, 'Dec=90 should have near-zero X');
  });

  // A3: nasaToUserData
  TestRunner.test('A. Pure Functions', 'A3a', 'nasaToUserData with full data', () => {
    const p = { n: 'Test Planet b', y: 2020, m: 'Transit', R: 2.5, T: 800, hz: 1, d: 100 };
    const ud = W.nasaToUserData(p);
    assertEqual(ud.name, 'Test Planet b');
    assertEqual(ud.year, 2020);
    assertEqual(ud.method, 'Transit');
    assertEqual(ud.radius, 2.5);
    assertEqual(ud.temp, 800);
    assertEqual(ud.hz, 1);
    assertEqual(ud.dist, 100);
    assertEqual(ud.cls, 'super', 'radius 2.5 should be super-earth');
  });
  TestRunner.test('A. Pure Functions', 'A3b', 'nasaToUserData with minimal data (name only)', () => {
    const p = { n: 'Minimal Planet' };
    const ud = W.nasaToUserData(p);
    assertEqual(ud.name, 'Minimal Planet');
    assertExists(ud.year, 'year should have default');
    assertExists(ud.method, 'method should have default');
    assertExists(ud.radius, 'radius should have default');
    assertExists(ud.cls, 'cls should be computed');
  });
  TestRunner.test('A. Pure Functions', 'A3c', 'nasaToUserData estimates temperature when missing', () => {
    const p = { n: 'No Temp Planet', m: 'RV' };
    const ud = W.nasaToUserData(p);
    assertEqual(ud.temp, 500, 'RV method heuristic should estimate 500K');

  TestRunner.test('G. Scene & Performance', 'G16h', 'Search index built with expected count', () => {
    const len = $('searchIndex.length');
    assertGreaterThan(len, 5000, 'searchIndex should have > 5000 entries');
  });
}

// ============================================================================
// FILTER BUTTONS
// ============================================================================

document.querySelectorAll('.filter-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    renderResults();
  });
});

// ============================================================================
// MAIN — load app, define tests, run
// ============================================================================

async function main() {
  const statusEl = document.getElementById('status-text');
  const runBtn = document.getElementById('btn-run');
  const rerunBtn = document.getElementById('btn-rerun-failed');

  statusEl.textContent = 'Loading app in iframe...';

  try {
    await waitForApp();
  } catch (e) {
    const isCORS = e.message.includes('cross-origin') || e.message.includes('Cannot access iframe');
    if (isCORS || window.location.protocol === 'file:') {
      statusEl.style.color = '#f06060';
      statusEl.innerHTML = '';
      const errBox = document.createElement('div');
      errBox.style.cssText = 'padding:24px;max-width:700px;margin:20px auto;background:rgba(220,60,60,.08);border:1px solid rgba(220,60,60,.25);border-radius:8px;font-size:13px;line-height:1.7;color:#c0cce0;';
      errBox.innerHTML = `
        <div style="color:#f06060;font-size:15px;font-weight:600;margin-bottom:12px;">⚠ Cannot run tests from file:// protocol</div>
        <div>Browsers block iframe cross-origin access on <code style="background:rgba(255,255,255,.08);padding:2px 6px;border-radius:3px;">file://</code> URLs. Start a local HTTP server from the project root:</div>
        <pre style="background:rgba(0,0,0,.3);padding:12px 16px;border-radius:6px;margin:12px 0;color:#5cd880;font-size:13px;overflow-x:auto;"><code>cd "${window.location.pathname.replace('/tests/test.html','').replace(/^\/([A-Z]:)/,'$1')}"
python3 -m http.server 8000</code></pre>
        <div>Then open: <a href="http://localhost:8000/tests/test.html" style="color:#7090c0;">http://localhost:8000/tests/test.html</a></div>
        <div style="margin-top:8px;color:#6a7d95;font-size:11px;">Alternatively: <code style="background:rgba(255,255,255,.08);padding:2px 6px;border-radius:3px;">npx serve .</code> or <code style="background:rgba(255,255,255,.08);padding:2px 6px;border-radius:3px;">php -S localhost:8000</code></div>
      `;
      document.getElementById('results').innerHTML = '';
      document.getElementById('results').appendChild(errBox);
      statusEl.textContent = 'CORS error — needs HTTP server (see below)';
    } else {
      statusEl.textContent = 'Failed to load app: ' + e.message;
      statusEl.style.color = '#f06060';
    }
    return;
  }

  statusEl.textContent = 'App loaded. Defining tests...';
  defineTests();
  updateUI();

  statusEl.textContent = 'Ready to run (' + TestRunner.tests.length + ' tests)';
  runBtn.disabled = false;

  // Auto-run on load
  runBtn.disabled = true;
  rerunBtn.disabled = true;
  await TestRunner.run();
  runBtn.disabled = false;
  rerunBtn.disabled = false;

  // Manual run buttons
  runBtn.addEventListener('click', async () => {
    runBtn.disabled = true;
    rerunBtn.disabled = true;
    statusEl.style.color = '';
    await TestRunner.run();
    runBtn.disabled = false;
    rerunBtn.disabled = false;
  });

  rerunBtn.addEventListener('click', async () => {
    runBtn.disabled = true;
    rerunBtn.disabled = true;
    statusEl.style.color = '';
    await TestRunner.run(t => t.status === 'fail');
    runBtn.disabled = false;
    rerunBtn.disabled = false;
  });
}

main();
</script>
</body>
</html>
